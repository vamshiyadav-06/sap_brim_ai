# Runs on every push and pull request: backend tests, frontend tests/build/audit, and the production
# Compose configuration. Nothing here deploys anything and no secret is used: the tests run against a
# throwaway PostgreSQL service and provider calls are disabled (tests marked "live" are skipped).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: sap_assistant
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sap_brim_ai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sap_assistant -d sap_brim_ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://sap_assistant:ci-only-password@127.0.0.1:5432/sap_brim_ai_test
      DATABASE_URL: postgresql://sap_assistant:ci-only-password@127.0.0.1:5432/sap_brim_ai_test
      ENVIRONMENT: development
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      LLM_ALLOWED_PROVIDERS: ""
      WEB_FALLBACK_ENABLED: "False"
      RETRIEVAL_CACHE_WARMUP: "False"
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ hashFiles('backend/requirements.lock') }}
      - name: Install the same hashed lock the production image uses
        run: |
          python -m pip install --upgrade "pip>=26.2"
          pip install --require-hashes --no-deps --only-binary :all: \
            --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.lock
          pip install pyyaml
          pip check
      - name: Enable pgvector in the test database
        run: python -c "import psycopg2,os; c=psycopg2.connect(os.environ['TEST_DATABASE_URL']); c.autocommit=True; c.cursor().execute('CREATE EXTENSION IF NOT EXISTS vector')"
      - name: Backend tests
        run: python -m pytest backend/tests -m "not live" -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run src
      - run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Production Compose file is valid with the shipped template
        run: |
          sed -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/' \
              -e 's/^SAP_BRIM_DB_PASSWORD=.*/SAP_BRIM_DB_PASSWORD=ci/' \
              -e 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci/' .env.example > "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" -f docker-compose.prod.yml config --quiet
      - name: Deployment scripts parse
        run: for f in scripts/production/*.sh scripts/staging/*.sh; do bash -n "$f"; done
      - name: The unfilled template is refused by the production env check
        run: "! python3 scripts/production/validate_env.py .env.example"
